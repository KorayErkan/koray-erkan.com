{{ define "main" }}
  {{ .Content }}
  {{ with first 3 (where site.RegularPages "Section" "blog") }}
    <h2>Recent posts</h2>
    <ul class="posts">
      {{ range . }}<li><time>{{ .Date.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
    </ul>
  {{ end }}
{{ end }}
